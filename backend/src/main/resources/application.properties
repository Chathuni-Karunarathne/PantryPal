spring.application.name=backend

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Required: Base64-encoded random key of at least 32 bytes. No fallback secret.
pantrypal.auth.jwt-secret=${JWT_SECRET:}
pantrypal.auth.issuer=pantrypal
pantrypal.auth.audience=pantrypal-api
pantrypal.auth.access-token-ttl=15m
pantrypal.auth.refresh-token-ttl=7d
pantrypal.auth.allowed-origins=${PANTRYPAL_ALLOWED_ORIGINS:http://localhost:3000}

# Explicitly opt in with the dev profile; never resets an existing password.
pantrypal.bootstrap.enabled=${PANTRYPAL_BOOTSTRAP_ADMIN:false}
pantrypal.bootstrap.email=${PANTRYPAL_ADMIN_EMAIL:}
pantrypal.bootstrap.password=${PANTRYPAL_ADMIN_PASSWORD:}
pantrypal.bootstrap.name=${PANTRYPAL_ADMIN_NAME:PantryPal Administrator}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
